<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav-in">
      <a class="nav-logo" href="/v6" aria-label="Insight Timer"></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/v3#statement">Discover</a>

        <button class="nav-icon" type="button" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <a class="nav-cta" href="#">Get the app</a>

  <main id="main">
    <section class="stage" id="stage" aria-label="A singing bowl you can play">
      <div class="glow" id="glow"></div>
      <canvas id="bowl" aria-label="A hand-hammered singing bowl"></canvas>
      <canvas id="waves" aria-hidden="true"></canvas>

      <div class="story" aria-live="polite">
        <h1 class="line" id="line">Where practice makes progress.</h1>
        <p class="count"><i id="lineN">01</i> <span id="lineOf">/ 08</span></p>
        <div class="links" id="ctaRow">
          <a class="btn" href="#">Get the app</a>
          <a class="link" href="/v3#guided">Become a teacher<span class="chev">›</span></a>
        </div>
      </div>

      <div class="cursor" id="cursor" aria-hidden="true"></div>
      <div class="meta">
        <span></span>
        <p class="hint" id="hint">Strike the bowl.</p>
        <p class="keys"><span>Space to strike · ← → to sing · M mute</span><button class="sound" id="sound" type="button" aria-pressed="false"><i></i><b id="soundLabel">Sound off</b></button></p>
      </div>
    </section>
  </main>

  <script type="module" src="/src/v6.js"></script>
