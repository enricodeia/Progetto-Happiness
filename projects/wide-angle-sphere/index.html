<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wide Angle Sphere — the scroll piece</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%230a0a0a'/%3E%3C/svg%3E"
    />
    <!-- perf pass (2026-09-17): the two things the opening waits for, asked
         for with the HTML rather than after main.js has run — the display
         face, and the bowl's geometry (Draco, 2.2 MB) -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ExposureTrialVAR.woff2" crossorigin />
    <link rel="preload" as="fetch" href="/models/bowl-option-c.glb" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- V2: the ground the page opens out into — a mask that propagates from
         behind the bowl. Layer 2, under everything the act puts on top of it. -->
    <div class="was-ground" id="ground"></div>
    <!-- V2: the layer UNDER the bowl (3 against the bowl's 4). "Until now"
         lives here, so the object is really in front of the type and the
         descent uncovers it with nothing animated but the bowl itself. -->
    <div class="was-under" id="under"></div>
    <!-- the bowl rides its own fixed layer over the whole page -->
    <div class="was-bowl-layer" id="bowlLayer"></div>

    <header class="was-nav" id="nav"></header>
    <!-- one line with the bowl in the middle of it -->
    <section class="was-hero" id="hero"></section>
    <!-- act two — 200vh of sticky. Two beats that alternate across the bowl:
         the long one on the left, then "Until now" on the right. -->
    <section class="was-until" id="until">
      <div class="was-until-stage" id="untilStage"></div>
    </section>
    <!-- V2 only: the quiet section act two's bowl descends into. Opaque and
         above the bowl's layer, so it takes the bowl over as it rises. -->
    <section class="was-quiet" id="quiet" hidden></section>
    <section class="was-above" id="above"></section>

    <!-- the canvas experience: photograph + glass card on the left, the sphere
         on the right. The canvas is INSIDE the stage, so the section arrives
         from below like any other and then pins. -->
    <section class="was-pin" id="pinA">
      <div class="was-stage" id="stageA">
        <div class="was-canvas-layer" id="canvasLayer"></div>
        <div class="was-panel-left" id="leftA"></div>
        <div class="was-copy-box" id="copybox"></div>
      </div>
    </section>

    <!-- sticky 2 — steps 4-6 of the same clock: the statement, then the
         three sources of evidence stacked under it, one filling per step. -->
    <section class="was-pin was-held" id="pinB">
      <div class="was-stage is-solid" id="stageB">
        <div class="was-panel-left is-full" id="leftB"></div>
        <!-- V2: the canvas experience moves down into this stage, and brings
             its own copy column with it -->
        <div class="was-copy-box" id="copyboxB"></div>
        <!-- V2: the trust network — users → teachers → techniques, chained,
             fired by the same three ramps as the evidence rows. Replaces the
             sphere box above when `v2.network.show` is on. -->
        <div class="was-network-box" id="networkBox" hidden></div>
        <!-- V5 (his ask, 2026-09-21): two circles around the bowl that pull
             apart, gain a third, then a fourth the size of the bowl itself.
             Full-bleed, not the small corner box the sphere/network share —
             it needs the whole stage to stay centred on the bowl. -->
        <div class="was-circles-box" id="circlesBox" hidden></div>
        <!-- Experience 2 (his ask, 2026-09-21, the final task): three circles
             drawn top-right → bottom → top-left, the big arcs, and then the
             Atlas knot drawn OVER them — the Atlas's own view, cards and
             title are re-parented in here from #stageC while it is on. -->
        <div class="was-trio-box" id="trioBox" hidden></div>
      </div>
    </section>

    <!-- the last section: Atlas. It COLLAPSES over the held one — it is
         opaque and rises while that stage is still pinned — and then the knot
         draws itself through the rest of its own scroll. -->
    <section class="was-pin was-atlas" id="pinC">
      <div class="was-stage is-solid" id="stageC">
        <div class="was-atlas-view" id="atlasView"></div>
        <div class="was-atlas-title" id="atlasTitle"></div>
        <div class="was-atlas-cards" id="atlasCards"></div>
      </div>
    </section>

    <section class="was-below" id="below"></section>
    <!-- the room the page scrolls through to reveal the (fixed) footer
         beneath it — main.js keeps its height matched to the footer's own -->
    <div class="was-footer-spacer" id="footerSpacer"></div>
    <footer class="was-footer" id="footer"></footer>

    <div class="was-legend">1 / 2 — experience · T — titles · B — bowl · V — version · M — markers · C — clean</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
